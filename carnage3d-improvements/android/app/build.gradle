plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.carnage3d'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.carnage3d"
        minSdk 24          // Android 7.0 – WebAssembly in WebView
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // WASM und Data-Dateien dürfen NICHT komprimiert werden:
    // .wasm wird vom Browser direkt gestreamt, .data ist schon gepackt.
    aaptOptions {
        noCompress 'wasm', 'data'
    }

    sourceSets {
        main {
            // Primäres Assets-Verzeichnis (manuell kopierte Dateien):
            assets.srcDirs = ['src/main/assets']
            // Wenn dieser android/-Ordner im carnage3d-Repo liegt,
            // wird web/ automatisch als zweite Assets-Quelle eingebunden:
            //   carnage3d/android/app/ → ../../web/ = carnage3d/web/
            def webDir = file('../../web')
            if (webDir.exists()) {
                assets.srcDirs += [webDir]
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
