name: Build with cmake

on:
  push:
    branches: [master]
    paths:
      - cmake/**
      - src/**
      - third_party/**
      - CMakeLists.txt

  pull_request:
    paths:
      - cmake/**
      - src/**
      - third_party/**
      - CMakeLists.txt

  workflow_dispatch:

jobs:
  ubuntu:
    name: "Ubuntu (${{ matrix.compiler.cc }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {cc: gcc, cxx: g++}
          - {cc: clang, cxx: clang++}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update apt
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install --yes cmake libglew-dev libglfw3-dev libglm-dev libopenal-dev xorg-dev

      - name: Install clang
        run: sudo apt install --yes clang
        if: ${{ matrix.compiler.cc == 'clang' }}

      - name: Configure CMake
        run: |
          cmake -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_BOX2D=Yes \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --parallel 2

  macos:
    name: "macOS (${{ matrix.compiler.cc }}, box2d: ${{ matrix.with_box2d }})"
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        with_box2d: [yes, no]
        compiler:
          - {cc: clang, cxx: clang++}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: brew install glew glfw glm openal-soft

      - name: Install Box2D
        run: brew install box2d
        if: ${{ matrix.with_box2d == 'no' }}

      - name: Configure CMake
        run: |
          cmake -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_BOX2D=${{ matrix.with_box2d }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --parallel 2
